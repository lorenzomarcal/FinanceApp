<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}FinanceApp{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  {% if g.usuario %}
  <header class="topbar">
    <a class="brand" href="{{ url_for('inicio') }}">FinanceApp</a>
    <nav>
      <a href="{{ url_for('inicio') }}">Dashboard</a>
      <a href="{{ url_for('investimentos') }}">Investimentos</a>
      <a href="{{ url_for('perfil') }}">Perfil</a>
      <form action="{{ url_for('logout') }}" method="POST" class="inline-form">
        <button class="link-button" type="submit">Sair</button>
      </form>
    </nav>
  </header>
  {% endif %}

  <main class="container">
    {% with mensagens = get_flashed_messages(with_categories=true) %}
      {% if mensagens %}
        <div class="messages">
          {% for categoria, mensagem in mensagens %}
            <div class="alert alert-{{ categoria }}">{{ mensagem }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
