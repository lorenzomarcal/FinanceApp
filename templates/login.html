{% extends "base.html" %}
{% block title %}Entrar | FinanceApp{% endblock %}
{% block mensagens %}{% endblock %}
{% block content %}
<div class="auth">
  <span class="brand">FinanceApp</span>
  <section class="auth-form">
    <h1>Entrar</h1>
    {% include "_mensagens.html" %}
    <form method="POST" action="{{ url_for('login') }}" class="form-grid">
      <label>Usuário
        <input type="text" name="nome" value="{{ nome or '' }}" minlength="3" maxlength="30" autocomplete="username" required autofocus>
      </label>
      <label>Senha
        <input type="password" name="senha" minlength="8" autocomplete="current-password" required>
      </label>
      <button class="btn primary" type="submit">Entrar</button>
    </form>
    <p class="auth-footer">Não tem conta? <a href="{{ url_for('cadastro') }}">Criar conta</a></p>
  </section>
</div>
{% endblock %}
